<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Gerenciador de Tarefas</h1>
            <p>Organize seu dia a dia com Git e JavaScript</p>
        </header>

        <!-- Formulário para adicionar nova tarefa -->
        <form id="task-form">
            <input type="text" id="task-input" placeholder="Digite uma nova tarefa..." required>
            <button type="submit" id="btn-add">Adicionar</button>
        </form>

        <!-- Container da lista de tarefas -->
        <main>
            <p>
                Total de Tarefas:
                <span id="total-count">
                    0
                </span>
            </p>
            <ul id="task-list">
                <!-- As tarefas serão renderizadas aqui via JavaScript -->
            </ul>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
